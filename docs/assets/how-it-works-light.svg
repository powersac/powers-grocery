<svg viewBox="0 0 1180 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>How the grocery list stays one list</title>

  <!-- palette, taken from the app's own tokens in src/style.css -->
  <!-- ink #1D231C, muted #616B5D, focus blue #2B6CB0, clay #A9552F, herb green #35603F, faint #8A9384 -->

  <!-- ribbons first, so the nodes sit on top of them -->
  <!-- Carter's link -> Worker -->
  <path d="M 212,80 C 331,80 331,110 450,110 L 450,180 C 331,180 331,150 212,150 Z" fill="#2B6CB0" fill-opacity="0.45"/>
  <!-- Partner's link -> Worker -->
  <path d="M 212,166 C 331,166 331,180 450,180 L 450,250 C 331,250 331,236 212,236 Z" fill="#A9552F" fill-opacity="0.45"/>
  <!-- the daily cron -> Worker -->
  <path d="M 212,252 C 331,252 331,250 450,250 L 450,280 C 331,280 331,282 212,282 Z" fill="#35603F" fill-opacity="0.45"/>
  <!-- Worker -> the one KV blob -->
  <path d="M 462,110 C 591,110 591,110 720,110 L 720,266 C 591,266 591,266 462,266 Z" fill="#1D231C" fill-opacity="0.45"/>
  <!-- Worker -> refused, the thin flow that never reaches the blob -->
  <path d="M 462,266 C 591,266 591,280 720,280 L 720,294 C 591,294 591,280 462,280 Z" fill="#8A9384" fill-opacity="0.55"/>
  <!-- the one KV blob -> both phones -->
  <path d="M 732,110 C 866,110 866,110 1000,110 L 1000,266 C 866,266 866,266 732,266 Z" fill="#1D231C" fill-opacity="0.45"/>

  <!-- nodes -->
  <rect x="200"  y="80"  width="12" height="70"  rx="2" fill="#2B6CB0"/>
  <rect x="200"  y="166" width="12" height="70"  rx="2" fill="#A9552F"/>
  <rect x="200"  y="252" width="12" height="30"  rx="2" fill="#35603F"/>
  <rect x="450"  y="110" width="12" height="170" rx="2" fill="#1D231C"/>
  <rect x="720"  y="110" width="12" height="156" rx="2" fill="#1D231C"/>
  <rect x="720"  y="280" width="12" height="14"  rx="2" fill="#8A9384"/>
  <rect x="1000" y="110" width="12" height="156" rx="2" fill="#1D231C"/>

  <!-- column 1 labels: right anchored, left of the nodes -->
  <text x="192" y="105" text-anchor="end" font-size="15" font-weight="600" fill="#1D231C">Carter's link</text>
  <text x="192" y="121" text-anchor="end" font-size="12" fill="#616B5D">plans, edits, deletes</text>
  <text x="192" y="191" text-anchor="end" font-size="15" font-weight="600" fill="#1D231C">Partner's link</text>
  <text x="192" y="207" text-anchor="end" font-size="12" fill="#616B5D">shops, ticks, adds</text>
  <text x="192" y="262" text-anchor="end" font-size="15" font-weight="600" fill="#1D231C">Daily cron</text>
  <text x="192" y="278" text-anchor="end" font-size="12" fill="#616B5D">every day at 09:00 UTC</text>

  <!-- column 2 label: centered above the node -->
  <text x="456" y="70" text-anchor="middle" font-size="15" font-weight="600" fill="#1D231C">One Worker</text>
  <text x="456" y="86" text-anchor="middle" font-size="12" fill="#616B5D">the link is the credential</text>

  <!-- column 3 labels -->
  <text x="726" y="70" text-anchor="middle" font-size="15" font-weight="600" fill="#1D231C">One KV blob</text>
  <text x="726" y="86" text-anchor="middle" font-size="12" fill="#616B5D">catalog, list, ten days of dinners</text>
  <text x="742" y="292" text-anchor="start" font-size="11" fill="#6E7767">refused, only Carter's link deletes and plans</text>

  <!-- column 4 label: left anchored, right of the node -->
  <text x="1020" y="183" text-anchor="start" font-size="15" font-weight="600" fill="#1D231C">Both phones</text>
  <text x="1020" y="199" text-anchor="start" font-size="12" fill="#616B5D">within fifteen seconds</text>
</svg>
